<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VIBE MATCH — Your photo has a vibe. We’ll find the music.</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths back to the repository base URL
      var pathSegments = window.location.pathname.split('/');
      var repoIndex = pathSegments.indexOf('Vibe-Match');
      var base = repoIndex !== -1 ? '/' + pathSegments.slice(1, repoIndex + 1).join('/') + '/' : '/';
      window.location.replace(base);
    </script>
  </head>
  <body class="bg-[#17151A] text-[#F4EEE7]">
  </body>
</html>
